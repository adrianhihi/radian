[profile.default]
src = "src"
out = "out"
libs = ["lib"]
# Match the production Pons V2 deployment (Sourcify exact_match):
# solc 0.8.35, evm cancun, optimizer runs 200.
# v0 contracts (src/*.sol) pin 0.8.26 and are auto-compiled with that version.
solc_version = "0.8.26"
via_ir = true
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "./test" }]

[rpc_endpoints]
arc_testnet = "https://rpc.testnet.arc.io"
# Set ARC_MAINNET_RPC in your environment (Arc mainnet public RPC / a provider key).
arc_mainnet = "${ARC_MAINNET_RPC}"
