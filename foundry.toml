[profile.default]
src = "src"
out = "out"
libs = ["lib"]
# Source-identical to the production Pons V2 deployment (Sourcify exact_match on
# Robinhood Chain, built with 0.8.35); we compile everything with 0.8.26, via-IR,
# evm cancun (v4-core needs TSTORE; probed live on Arc), optimizer runs 200.
solc_version = "0.8.26"
via_ir = true
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# No CBOR metadata / bytecode hash: the EVM code is then byte-identical from any
# checkout (paths and file ordering can no longer change the trailer), which is
# what makes the hook's CREATE2 salt mining and Arcscan verification reproducible.
bytecode_hash = "none"
cbor_metadata = false
fs_permissions = [{ access = "read", path = "./test" }]
# LayerZero V2 (the omnichain layer, src/omni + test/omni) is vendored from the npm
# tarballs under lib/layerzero/<package>-<version>/ (oft-evm 4.0.1, oapp-evm 0.4.1,
# lz-evm-protocol-v2 / messagelib-v2 / v1-0.7 3.0.168, test-devtools-evm-foundry 8.0.1,
# solidity-bytes-utils 0.8.4); the version is the directory name, so remappings.txt is
# the pin. Those packages need OpenZeppelin files the 23-file subset in
# lib/openzeppelin-contracts does not carry (AccessControl, ECDSA, DoubleEndedQueue...),
# so remappings.txt scopes "@openzeppelin/contracts/" to a full OZ 5.6.1 copy for the
# lib/layerzero/, src/omni/ and test/omni/ contexts only. Every other source keeps the
# subset, and its bytecode is unchanged. Rule: a contract must live in one world; never
# mix the two Ownable / ERC20 definitions in one inheritance chain.

[rpc_endpoints]
arc_testnet = "https://rpc.testnet.arc.io"
# Set ARC_MAINNET_RPC in your environment (Arc mainnet public RPC / a provider key).
arc_mainnet = "${ARC_MAINNET_RPC}"
robinhood_testnet = "https://rpc.testnet.chain.robinhood.com"
robinhood_mainnet = "https://rpc.mainnet.chain.robinhood.com"
